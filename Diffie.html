<!DOCTYPE html>
<html>
<head>
 <title>Diffie Hellman Key Exchange</title>
</head>
<body>
<h2>Diffie-Hellman Key Exchange</h2>
<script>
function power(a, b, p) {
 let result = 1;
 for(let i = 0; i < b; i++) {
 result = (result * a) % p;
 }
 return result;
}
let p = parseInt(prompt("Enter Prime Number (p): "));
let g = parseInt(prompt("Enter Primitive Root (g): "));
let a = parseInt(prompt("Enter Private Key of User A: "));
let b = parseInt(prompt("Enter Private Key of User B: "));
let A = power(g, a, p);
let B = power(g, b, p);
let keyA = power(B, a, p);
let keyB = power(A, b, p);
document.write("<h3>Results</h3>");
document.write("Prime Number (p): " + p + "<br>");
document.write("Primitive Root (g): " + g + "<br><br>");
document.write("Public Key of User A: " + A + "<br>");
document.write("Public Key of User B: " + B + "<br><br>");
document.write("Secret Key Generated by User A: " + keyA + "<br>");
document.write("Secret Key Generated by User B: " + keyB + "<br>");
</script>
</body>
</html>
